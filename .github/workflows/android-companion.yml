name: Android Companion

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-companion.yml"
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-companion.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Android SDK platform 37.2 and build-tools 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon test :app:verifyNoNetworkPermission assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shuriken-companion-debug-apk
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk
